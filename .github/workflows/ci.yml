name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend — Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy app

  backend-tests:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Fresh production schema smoke test
        env:
          DATABASE_PATH: ${{ runner.temp }}/medai-migration.db
        run: |
          alembic upgrade head
          python -c "import sqlite3; c=sqlite3.connect('${{ runner.temp }}/medai-migration.db'); assert c.execute('select count(*) from branches').fetchone()[0] == 15; assert 'doctor_seen_at' in [r[1] for r in c.execute('pragma table_info(analyses)')]; assert 'data' in [r[1] for r in c.execute('pragma table_info(documents)')]; print('migration smoke: OK')"
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-fail-under=70 -q
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

  frontend-lint:
    name: Frontend — Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - name: ESLint
        run: npm lint
      - name: TypeScript check
        run: npm typecheck
      - name: Prettier check
        run: npm format:check

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  docker-build:
    name: Docker — Build images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t medai-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t medai-frontend:${{ github.sha }} ./frontend
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker tag medai-backend:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/medai-backend:${{ github.sha }}
          docker tag medai-frontend:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/medai-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/medai-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/medai-frontend:${{ github.sha }}