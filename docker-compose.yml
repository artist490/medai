  #     - POSTGRES_PASSWORD=medai
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U medai -d medai"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  medai-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  medai-data:
  # postgres-data: