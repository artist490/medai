[tool.ruff]
# Явный набор правил: CI не должен зависеть от того, какие правила
# новая версия ruff включает по умолчанию.
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",   # импорты: дубли, неверные позиции
    "E7",   # синтаксические мелочи
    "E9",   # реальные ошибки исполнения
    "F",    # pyflakes: неиспользуемые имена, undefined
    "I",    # сортировка импортов
]
ignore = [
    "E501",  # длину строк проверяет форматтер, не линтер
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
